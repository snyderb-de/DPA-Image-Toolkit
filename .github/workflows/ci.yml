name: CI

# The suite used to run only inside the release workflow, which fires on tags.
# That is why an OpenCV 5 incompatibility sat undetected until it blocked a
# tagged build. Run the same tests on every pull request and on master.
#
# Windows on purpose: it matches the release environment, which is where the
# EXE is built and where the break would have surfaced.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Windows, Python 3.11)
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s testing -p "test_*.py"
