name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s testing -p "test_*.py"

      - name: Build
        run: pyinstaller packaging/dpa-toolkit.spec --distpath dist --workpath build

      - name: Zip
        env:
          TAG: ${{ github.ref_name }}
        run: Compress-Archive -Path dist/DPA-Image-Toolkit -DestinationPath "DPA-Image-Toolkit-Windows-$env:TAG.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: DPA-Image-Toolkit-Windows-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
