name: Release

on:
  push:
    tags:
      - "v*"
  # Build an EXE from any branch without tagging, so a risky change can be
  # smoke-tested on Windows before it is merged. Dispatch builds attach the
  # EXE as a workflow artifact and are never published as a release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the EXE, e.g. v1.1.7. Must look like a version — a branch name will fail."
        required: false
        default: "v0.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    env:
      # On a tag push this is the tag. On dispatch the ref is a branch name,
      # which write_version_info.py cannot parse, so take the input instead.
      DPA_IMAGE_TOOLKIT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s testing -p "test_*.py"

      - name: Generate version metadata
        run: python packaging/write_version_info.py $env:DPA_IMAGE_TOOLKIT_VERSION build/version-info.txt

      - name: Build
        run: pyinstaller packaging/dpa-toolkit.spec --distpath dist --workpath build

      - name: Stamp EXE metadata
        run: pyi-set_version build/version-info.txt dist/image-toolkit.exe

      - name: Sign release EXE
        if: github.event_name == 'push'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.DPA_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.DPA_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw "Release signing secrets are required."
          }
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw "Windows SDK SignTool was not found." }
          $pfx = Join-Path $env:RUNNER_TEMP "dpa-release-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            & $tool.FullName sign /f $pfx /p $env:SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/image-toolkit.exe
            if ($LASTEXITCODE -ne 0) { throw "SignTool failed to sign the release EXE." }
            & $tool.FullName verify /pa dist/image-toolkit.exe
            if ($LASTEXITCODE -ne 0) { throw "Release EXE signature verification failed." }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare release asset
        run: Copy-Item dist/image-toolkit.exe "image-toolkit.exe"

      - name: Upload EXE as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-toolkit-${{ env.DPA_IMAGE_TOOLKIT_VERSION }}
          path: image-toolkit.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: DPA Image Toolkit
          files: image-toolkit.exe
          fail_on_unmatched_files: true
